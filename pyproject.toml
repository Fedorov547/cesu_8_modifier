[project]
name = "cesu-8-modifier"
version = "0.1.0"
description = "Converts CESU-8 bytes to Python strings, merging surrogate pairs into single code points."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
